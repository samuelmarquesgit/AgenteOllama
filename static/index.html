<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Tork, o assistente virtual da ToolExpert: tira dúvidas sobre ferramentas, mostra produtos e informa sobre pedidos, pagamento e trocas.">
  <meta name="theme-color" content="#C2410C">
  <title>Tork · Assistente da ToolExpert</title>
  <link rel="icon" href="/static/brand/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="/static/fonts/inter-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/static/css/tokens.css">
  <link rel="stylesheet" href="/static/css/chat.css">
  <script type="module" src="/static/js/chat.js"></script>
</head>
<body>
<div class="app">
  <header class="topo">
    <div class="topo-interno">
      <img class="logo logo-claro" src="/static/brand/logo-toolexpert.svg" alt="ToolExpert AI" width="134" height="34">
      <img class="logo logo-escuro" src="/static/brand/logo-toolexpert-escuro.svg" alt="ToolExpert AI" width="134" height="34">
      <output id="status" class="status" aria-live="polite">Conectando…</output>
      <button id="tema" class="botao-icone" type="button" aria-label="Alternar tema">🌙</button>
      <button id="nova" class="botao-secundario" type="button" aria-label="Começar nova conversa">↺ <span class="rotulo">Nova conversa</span></button>
    </div>
  </header>

  <main class="palco">
    <section id="conversa" class="conversa" role="log" aria-live="polite" aria-label="Conversa com o Tork"></section>
  </main>

  <footer class="rodape">
    <div class="rodape-interno">
      <div id="sugestoes" class="chips" aria-label="Sugestões de perguntas"></div>
      <form id="form" class="compositor" autocomplete="off">
        <label for="mensagem" class="sr-only">Sua mensagem</label>
        <input id="mensagem" maxlength="500" placeholder="Digite sua dúvida ou &quot;menu&quot;…" aria-label="Sua mensagem">
        <button id="enviar" class="enviar" type="submit">Enviar</button>
      </form>
      <p class="aviso-rodape">Versão de demonstração: produtos, preços e estoques são fictícios. Não envie dados pessoais (CPF, cartão, endereço).</p>
    </div>
  </footer>
</div>
<noscript>O chat do Tork precisa de JavaScript habilitado.</noscript>
</body>
</html>
