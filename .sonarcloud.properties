# Configuração da análise automática do SonarQube Cloud (aplicativo do GitHub).
# Documentação: https://docs.sonarsource.com/sonarqube-cloud/advanced-setup/automatic-analysis/

# Código de produção e de teste separados: regras de teste valem só para tests/.
sonar.sources=app,static,database,agente.py
sonar.tests=tests

# Os arquivos .sql são migrações em dialeto SQLite. O analisador de SQL do SonarQube Cloud
# segue o dialeto PL/SQL (Oracle) e sugere construções que o SQLite não suporta
# (ex.: CREATE OR REPLACE TRIGGER, constantes em DDL). A integridade do esquema é coberta
# pelos testes em tests/test_banco.py (FKs, CHECKs, triggers, rollback).
sonar.exclusions=database/migrations/**/*.sql,database/seeds/data/**

sonar.python.version=3.12
sonar.sourceEncoding=UTF-8
